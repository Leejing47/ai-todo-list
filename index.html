<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo 列表 V4.0 (React)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 460px;
      margin: 50px auto;
      padding: 0 20px;
    }
    .input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .status-msg {
      min-height: 20px;
      margin: 0 0 12px;
      font-size: 13px;
      color: #666;
    }
    .status-msg[data-type="error"] {
      color: #d93025;
    }
    ul {
      list-style-type: none;
      padding: 8px;
      min-height: 60px;
      border: 1px dashed #dce1e7;
      border-radius: 6px;
    }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 4px;
      margin-bottom: 8px;
      word-break: break-all;
    }
    li span {
      flex: 1;
      cursor: pointer;
    }
    li button {
      padding: 4px 10px;
      font-size: 12px;
    }
    li button.complete-btn {
      background-color: #28a745;
    }
    li button.complete-btn:hover {
      background-color: #218838;
    }
    li button.edit-btn {
      background-color: #6c757d;
    }
    li button.edit-btn:hover {
      background-color: #5a6268;
    }
    li button.delete-btn {
      background-color: #dc3545;
    }
    li button.delete-btn:hover {
      background-color: #b02a37;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
