<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo 列表 V4.0 (Context 主题与持久化)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #eef2f6;
    }
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: background-color 0.25s, color 0.25s;
    }
    /* Light 浅色主题 */
    .app-container.theme-light {
      background-color: #ffffff;
      color: #1e293b;
    }
    /* Dark 深色主题 */
    .app-container.theme-dark {
      background-color: #1e293b;
      color: #f8fafc;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header-bar h1 {
      margin: 0;
      font-size: 24px;
    }
    .theme-toggle-btn {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 6px;
      background-color: #475569;
      color: #ffffff;
    }
    .theme-light .theme-toggle-btn {
      background-color: #334155;
    }
    .theme-dark .theme-toggle-btn {
      background-color: #f59e0b;
      color: #0f172a;
      font-weight: bold;
    }
    .input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .todo-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      outline: none;
    }
    .todo-input-light {
      background-color: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
    }
    .todo-input-dark {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    .status-msg {
      min-height: 20px;
      margin: 0 0 12px;
      font-size: 13px;
      color: #666;
    }
    .status-msg[data-type="error"] {
      color: #ef4444;
    }
    ul {
      list-style-type: none;
      padding: 8px;
      min-height: 60px;
      border: 1px dashed #94a3b8;
      border-radius: 6px;
      margin: 0;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .todo-item-light {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .todo-item-dark {
      background-color: #334155;
      border: 1px solid #475569;
    }
    .todo-item span {
      flex: 1;
      cursor: pointer;
    }
    .todo-item button {
      padding: 4px 10px;
      font-size: 12px;
    }
    .todo-item button.complete-btn {
      background-color: #10b981;
    }
    .todo-item button.edit-btn {
      background-color: #64748b;
    }
    .todo-item button.delete-btn {
      background-color: #ef4444;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
